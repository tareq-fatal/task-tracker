# =============================================================================
# Task Tracker — USB self-service stack.
#
# Three services, one network, no external dependencies:
#   postgres  — the database (internal only, never exposed to the host)
#   app       — Next.js standalone; applies Prisma migrations on every boot
#   caddy     — TLS termination + reverse proxy (Let's Encrypt with --tls domain,
#               its own local CA with --tls internal, plain HTTP with --tls http)
#
# TOF-0794 (Tarek 31.10.2026): offline installs set TT_PULL_POLICY=never in .env
# so compose never tries to pull — every image must already be loaded from
# images/ (install.sh checks that). The app's `build:` section is only used by
# online installs (`compose build app`); offline runs always use `up --no-build`.
#
# This file is NOT meant to be edited by the customer. install.sh writes the
# accompanying .env and Caddyfile; everything configurable lives there.
#
#   Start:    docker compose up -d
#   Logs:     docker compose logs -f app
#   Stop:     docker compose down          (data survives — it is in volumes)
# =============================================================================

name: task-tracker

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: ${TT_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasktracker}
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — run install.sh}
      # Deterministic collation so pg_dump/pg_restore round-trips cleanly.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tasktracker} -d ${POSTGRES_DB:-tasktracker}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 768M

  app:
    # Pre-built and loaded from images/ in offline mode; built from ./app in
    # online mode. Either way the tag is the same, so `up -d` finds it.
    image: task-tracker:${TT_VERSION:-1.1.0}
    pull_policy: ${TT_PULL_POLICY:-missing}
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined by `next build` and CANNOT be changed later
        # by editing .env — it has to be baked in here. Values come from .env
        # (Compose interpolates it automatically).
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        # TOF-0791/TOF-0794: instance name in the UI (install.sh --app-name).
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      # Uploaded attachments + voice notes. Backed up by backup.sh.
      - uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1536M

  caddy:
    image: caddy:2-alpine
    pull_policy: ${TT_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${TT_HTTP_PORT:-80}:80"
      - "${TT_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates + OCSP staples — and with --tls internal the local CA
      # itself. Losing this volume means re-issuing certs (Let's Encrypt
      # rate-limits) or re-importing a NEW root CA on every device — backup.sh
      # includes it.
      - caddy_data:/data
      - caddy_config:/config
      # TOF-0794: exported root certificate of the local CA (--tls internal),
      # served at http://<server>/ca.crt. Empty/unused in the other modes.
      - ./ca:/srv/ca:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
