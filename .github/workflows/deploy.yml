name: Deploy to VPS (tasks.coastshield.net)

# Manual, one-click redeploy of `main` to the Coast-Shield VPS.
#
# ── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#   Repository secrets (Settings → Secrets and variables → Actions):
#     VPS_SSH_KEY   private key `github-actions-tasks-v1`. Its public half is
#                   in marisight@13.140.146.101:~/.ssh/authorized_keys with a
#                   FORCED COMMAND (~/bin/gh-deploy-tasks.sh) — the key can
#                   ONLY deploy, it cannot open a shell.
#     VPS_HOST      optional, default 13.140.146.101
#     VPS_USER      optional, default marisight (root SSH is disabled)
#
# ── HOW IT WORKS ─────────────────────────────────────────────────────────────
#   The runner checks out main and streams `git archive | gzip` over SSH.
#   The forced command on the VPS extracts it into /home/marisight/apps/
#   task-tracker and runs infra/deploy-tasks.sh with SKIP_GIT=1, which does
#   the rest: pre-deploy DB dump + rollback image tag, docker build, compose
#   up (prisma migrate deploy runs on boot).
#
#   Rollback = on the VPS:
#     docker tag task-tracker:rollback task-tracker:latest
#     cd /home/marisight/marisight/infra/prod && docker compose -f docker-compose.prod.yml up -d task-tracker
#   (plus, if a migration must be undone, restore the pre-deploy dump from
#   /home/marisight/backups/task-tracker/pre-deploy/).
#
#   First-time DB seed is NOT part of this workflow (it wipes tasks!) — run it
#   deliberately on the VPS: docker compose exec task-tracker npx prisma db seed

on:
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vorbedingung — Deploy-Secret muss gesetzt sein
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY fehlt — Deploy nicht möglich (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          HOST='${{ secrets.VPS_HOST }}'; HOST="${HOST:-13.140.146.101}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (Quellcode streamen — forced command sichert, baut, startet)
        run: |
          HOST='${{ secrets.VPS_HOST }}';  HOST="${HOST:-13.140.146.101}"
          USER='${{ secrets.VPS_USER }}';  USER="${USER:-marisight}"
          # Das Client-Kommando ("deploy") wird vom forced command ignoriert —
          # entscheidend ist der tar.gz-Strom auf stdin.
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/id_deploy "$USER@$HOST" deploy

      - name: Smoke-check public URL
        if: always()
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' https://tasks.coastshield.net/login || echo 000)
          echo "login -> $code"
          test "$code" = "200"
